<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: #222;
            max-width: 450px;
            margin: 40px auto;
            padding: 0 15px;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        fieldset {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 12px;
        }

        legend {
            font-weight: bold;
            color: #444;
            padding: 0 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        input[type="submit"]:hover {
            background-color: #1a252f;
        }

        a {
            color: #2c3e50;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>Login</h2>
    <form>
        <fieldset>
            <legend>Dados de login</legend>
            <label for="Nickname/Email">Nickname/Email: </label>
            <input type="text" id="Nickname/Email" name="Nickname/Email" placeholder="Digite seu Nickname/Email">  
        </fieldset>
        
        <fieldset>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">  
        </fieldset>

        <input type="submit" value="Login">
        <!-- Link apontando exatamente para o arquivo de cadastro -->
        <p>Ainda não tem conta? <a href="Tela_cadastro.html">Cadastre-se aqui</a></p>
    </form>

</body>
</html>
