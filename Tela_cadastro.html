<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: #222;
            max-width: 450px;
            margin: 40px auto;
            padding: 0 15px;
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        fieldset {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 12px;
            padding: 12px;
        }

        legend {
            font-weight: bold;
            color: #444;
            padding: 0 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .opcao-genero {
            display: inline-block;
            margin-right: 15px;
        }

        input[type="submit"] {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        input[type="submit"]:hover {
            background-color: #1a252f;
        }

        a {
            color: #2c3e50;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>Cadastro</h2>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome_completo">Nome Completo: </label>
            <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu Nome Completo">  
        </fieldset>

        <fieldset>
            <label for="Nickname">Nickname:</label>
            <input type="text" id="Nickname" name="Nickname" placeholder="Digite seu NickName">
        </fieldset>

        <fieldset>
            <label for="dt_nascimento">Data de Nascimento:</label>
            <input type="date" id="dt_nascimento" name="dt_nascimento">
        </fieldset>

        <fieldset>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
        </fieldset>

        <fieldset>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">  
        </fieldset>

        <fieldset>
            <legend>Gênero</legend>
            <label for="Masculino" class="opcao-genero">
                <input type="radio" id="Masculino" name="genero" value="M"> Masculino
            </label>

            <label for="Feminino" class="opcao-genero">
                <input type="radio" id="Feminino" name="genero" value="F"> Feminino
            </label>
        </fieldset>

        <input type="submit" value="Cadastrar">
        <!-- Link apontando exatamente para o arquivo de login -->
        <p>Já possui uma conta? <a href="Tela_login.html">Faça login</a></p>
    </form>

</body>
</html>
